# fly.ai mining server on fly.io, Treasure org: one machine with a volume for its SQLite database, so it
# doesn't scale out and doesn't stop when idle (miners hold jobs, and the expiry timer runs in-process).
# Deploy with mine/deploy.sh.
app = "flyai-mine"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_ORIGIN = "https://www.flyaiworld.com"  # the pages live on Vercel: wallet sign-in messages and /compute/connect links name the website
  VERIFIERS = "1"         # ~300 MB of memory each; 2 of them starved the main thread on 2 shared vCPUs, so miners waited seconds per request
  CANARY_POOL = "500"     # idle verifiers stop here: shared vCPUs get throttled under sustained load, which would delay real checks
  # paid orders (src/orders.ts): payments go to the dev wallet, which also funds MonthlyClaims
  PAY_TO = "0x625862521777E19Ad54Ce6C7ABeD9Ca54D6589ea"
  MIN_BID = "20"          # $FLYAI per job, ~$0.001 at $0.00005092 (2026-09-16)
  CACHED_PRICE = "5"      # already-settled jobs, ~$0.00025
  POOL_SHARE = "0.8"
  STORE_MAX_MB = "2000"   # buyers' uploads and program outputs, on the 10 GB volume; counted in 4 KB blocks (09-23)
  # Fly Roulette bets (src/roulette.ts; whole tokens): small bets, 10 to 2,000 FLYAI (the biggest win, 10 flies, is 19,000)
  ROULETTE_ON = "1"
  ROULETTE_EDGE = "0.05"
  ROULETTE_MIN_BET = "10"
  ROULETTE_MAX_BET = "5000"
  ROULETTE_MAX_DAY = "100000"
  ROULETTE_MAX_PAYOUT = "47500"
  ROULETTE_HOUSE_STOP = "200000"
  ROULETTE_MAX_LIVE = "8"
  # Fly Slots spins (src/slots.ts; whole tokens, 2026-09-29): 50 to 250 FLYAI a spin; the top prize (400x) of the
  # biggest spin is exactly SLOTS_MAX_PAYOUT, so every prize is payable. The house stop pauses spins after a bad day.
  SLOTS_ON = "1"
  SLOTS_MIN_BET = "50"
  SLOTS_MAX_BET = "250"
  SLOTS_MAX_DAY = "50000"
  SLOTS_MAX_PAYOUT = "100000"
  SLOTS_HOUSE_STOP = "300000"
  # Fly Race bets (src/race.ts; whole tokens, 2026-09-29): 50 to 5,000 FLYAI on a lane, to win (5.7x) or make the
  # podium (1.9x); the biggest win (5,000 x 5.7 = 28,500) is under RACE_MAX_PAYOUT, which refuses any bet past it
  RACE_ON = "1"
  RACE_EDGE = "0.05"
  RACE_MIN_BET = "50"
  RACE_MAX_BET = "5000"
  RACE_MAX_DAY = "100000"
  RACE_MAX_PAYOUT = "30000"
  RACE_HOUSE_STOP = "300000"
  RACE_MAX_LIVE = "8"
  # Fly Colosseum (src/arena.ts; whole tokens, 2026-09-30): Trader Fly tournaments. Entry, potions and the fee are
  # the defaults of a tournament the operator opens (POST /api/admin/arena/open can override each).
  # Fly pictures are the revealed art at 256 px (docs/colosseum/flies/<id>.webp), regenerate with the reveal folder.
  ARENA_ON = "1"
  ARENA_IMAGE = "https://flyaiworld.com/colosseum/flies/{id}.webp"
  ARENA_TRADERFLY = "0x18d4D831cA89672126172B73bA05f5A318ad5A72"
  ARENA_ENTRY = "5000"
  ARENA_POTION = "2500"
  ARENA_FEE_BPS = "1000"
  ARENA_HOURS = "24"
  ARENA_MIN_ENTRANTS = "4"
  ARENA_MAX_ENTRANTS = "256"
  ARENA_MAX_PER_WALLET = "3"
  # the house fee of every season (ARENA_FEE_BPS) is sent in $FLYAI to the dev wallet when the season is done,
  # from the payout wallet (FLIGHTPASS_PAYOUT_KEY): keep a little FLYAI and gas in it
  ARENA_FEE_TO = "0x625862521777E19Ad54Ce6C7ABeD9Ca54D6589ea"
  # On-chain record of every season (flytrade/contracts/src/ColosseumLedger.sol behind a proxy): set after deploying it, with
  #   fly secrets set ARENA_LEDGER_KEY=<the operator wallet's private key> -a flyai-mine
  # (a hot key that only pays gas). Off while ARENA_LEDGER is unset: seasons still run, nothing is posted.
  # ARENA_LEDGER = "0x..."
  ARENA_EXPLORER = "https://robin.etherscan.io"

[mounts]
  source = "mine_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # fly's default is 25 connections a machine; past that the proxy holds new requests at the edge. Miners and the
  # open live feeds used them up (2026-09-29: 0.05 s to connect, up to 28 s to the first byte of a static answer)
  [http_service.concurrency]
    type = "requests"
    soft_limit = 400
    hard_limit = 800

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "180s"   # both servers start before the proxy listens (first start builds new indexes)
    method = "GET"
    # the proxy's own answer (src/start.ts): a busy mining thread no longer marks the machine down for everyone
    path = "/healthz"

[[vm]]
  # dedicated since 2026-09-19: shared vCPUs got throttled under the mining fleet (every request 15-55 s, health checks flapping)
  cpu_kind = "performance"
  cpus = 2
  memory = "4gb"
