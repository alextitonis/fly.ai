# SHIT Token — Cloudflare Free Tier Config
# $0/month: Workers (100K req/day), D1 (5GB), R2 (10GB), KV (100K reads), DO (100 classes)

name = "shit-token"
compatibility_date = "2026-09-12"
compatibility_flags = ["python_workers"]

# D1 database (free: 5GB, 5M reads/day, 100K writes/day)
[[d1_databases]]
binding = "DB"
database_name = "shit-token"
database_id = "YOUR_D1_DATABASE_ID"

# R2 bucket (free: 10GB) — stores connectome weights
[[r2_buckets]]
binding = "WEIGHTS"
bucket_name = "shit-token-weights"

# KV namespace (free: 100K reads/day) — caching
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

# Secrets (free):
# npx wrangler secret put ROBINHOOD_RPC_URL
# npx wrangler secret put EXECUTOR_PRIVATE_KEY
# npx wrangler secret put DISCORD_WEBHOOK_URL
# npx wrangler secret put FLYAI_TOKEN_ADDRESS
# npx wrangler secret put PONS_FACTORY_ADDRESS

