<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:* http://127.0.0.1:* https://www.flyaiworld.com https://flyai-mine.fly.dev" />
    <title>Fly Pet</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
      #stage { position: fixed; inset: 0; }
      #fly { position: absolute; left: 50%; bottom: 0; width: 160px; height: 160px; margin-left: -80px; image-rendering: pixelated; -webkit-user-drag: none; cursor: grab; }
      #fly.left { transform: scaleX(-1); }
      #fly:active { cursor: grabbing; }
      #bubble {
        position: absolute; left: 50%; bottom: 158px; transform: translateX(-50%); box-sizing: border-box; width: max-content; max-width: 280px;
        padding: 8px 12px; background: #fff; color: #111; border: 2px solid #111; border-radius: 14px;
        font: 600 13px/1.3 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; text-align: center;
        opacity: 0; transition: opacity .15s; pointer-events: none;
      }
      #bubble.on { opacity: 1; }
      #bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -6px; background: #fff; border: solid #111; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bubble"></div>
      <img id="fly" alt="" draggable="false" />
    </div>
    <script type="module" src="/src/pet.ts"></script>
  </body>
</html>
