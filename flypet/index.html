<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:* http://127.0.0.1:* https://www.flyaiworld.com https://flyai-mine.fly.dev https://flyai-x402.fly.dev" />
    <title>Fly Pet</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
      #stage { position: fixed; inset: 0; }
      /* the fly and what it wears (src/expeditions.ts): #look is the 160 px box; wings sit behind the sprite, the rest on top */
      #look { position: absolute; left: 50%; bottom: 0; width: 160px; height: 160px; margin-left: -80px; }
      #look.left { transform: scaleX(-1); }
      #fly { position: absolute; inset: 0; width: 160px; height: 160px; image-rendering: pixelated; -webkit-user-drag: none; cursor: grab; }
      #wings, #wear { position: absolute; inset: 0; pointer-events: none; }
      .wear-g { position: absolute; transform: translate(-50%, -50%); font-size: 30px; line-height: 1; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
      .wear-g.sm { font-size: 22px; }
      #wings .wear-g { font-size: 34px; opacity: .9; }
      #look.set #fly { filter: drop-shadow(0 0 5px rgba(124,245,196,.85)); }
      /* away on an expedition: it flies up and out, a small pill keeps its place; it drops back in when it's back */
      #look.leaving { transition: transform 1.1s ease-in, opacity 1.1s ease-in; transform: translateY(-140px) rotate(-12deg); opacity: 0; }
      #look.landing { animation: xp-land .7s ease-out; }
      @keyframes xp-land { from { transform: translateY(-140px); opacity: 0; } to { transform: none; opacity: 1; } }
      body.away #look { visibility: hidden; }
      #away { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: #1a1a1a; color: #fff;
        border: 1px solid #2f2f2f; font: 600 12px "Segoe UI", system-ui, sans-serif; white-space: nowrap; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
      #away[hidden], #gift[hidden], #focus[hidden] { display: none; }
      #focus { position: absolute; left: 50%; bottom: 126px; margin-left: 36px; padding: 4px 10px; border-radius: 999px; background: #7cf5c4; color: #06140e;
        font: 700 12px "Segoe UI", system-ui, sans-serif; white-space: nowrap; cursor: pointer; }
      .xp-art { image-rendering: pixelated; vertical-align: middle; }
      .wear-g.xp-art { position: absolute; }
      #gift { position: absolute; left: 50%; bottom: 150px; margin-left: 34px; font-size: 22px; cursor: pointer; animation: xp-bob 1.2s ease-in-out infinite; }
      @keyframes xp-bob { 50% { transform: translateY(-5px); } }
      .trail { position: absolute; bottom: 8px; font-size: 16px; pointer-events: none; animation: xp-trail 1.2s ease-out forwards; }
      /* the memory game (issue #59): 12 cards in the pet window, flip two to match the item sprites */
      .mem-grid { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); z-index: 2; display: grid; grid-template-columns: repeat(4, 56px); gap: 6px; }
      .mem-card { width: 56px; height: 56px; padding: 0; border: 2px solid #2f2f2f; border-radius: 10px; background: #1a1a1a; color: #fff;
        font-size: 24px; line-height: 1; cursor: pointer; display: grid; place-items: center;
        font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
      .mem-card.open { background: #fff; border-color: #7cf5c4; }
      .mem-card.done { opacity: .45; border-color: #7cf5c4; }
      .mem-card .xp-art { width: 40px; height: 40px; }
      @keyframes xp-trail { from { opacity: .9; transform: translate(0, 0) scale(1); } to { opacity: 0; transform: translate(var(--dx), -18px) scale(.6); } }
      body.talking #gift, body.talking #away, body.talking #focus { display: none; }
      .trail.xp-art { width: 20px; height: 20px; }
      #fly:active { cursor: grabbing; }
      /* a bubble skin (an item): its colors */
      #bubble.skin { background: var(--bub-bg); color: var(--bub-ink); border-color: var(--bub-bg); }
      #bubble.skin::after { background: var(--bub-bg); border-color: var(--bub-bg); }
      /* its alerts and lines, as a chat message from it (2026-11-13): a click opens its chat */
      #bubble {
        position: absolute; left: 50%; bottom: 158px; transform: translateX(-50%) translateY(6px); box-sizing: border-box; width: max-content; max-width: 280px;
        padding: 8px 12px; background: #1a1a1a; color: #fff; border: 1px solid #2f2f2f; border-radius: 14px; border-bottom-left-radius: 4px;
        box-shadow: 0 8px 22px rgba(0,0,0,.45);
        font: 500 13px/1.35 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; text-align: left;
        opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; cursor: pointer;
      }
      #bubble.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; z-index: 3; }
      body.talking #bubble { display: none; }
      /* the fly's own chat (src/talk.ts): a panel just above the fly while the window is grown for it */
      #talk { position: absolute; left: 50%; bottom: 166px; transform: translateX(-50%); width: 360px; height: 440px; display: flex; flex-direction: column;
        background: #0b0b0b; color: #fff; border: 1px solid #2a2a2a; border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.55); overflow: hidden;
        font: 13px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; user-select: text; -webkit-user-select: text; }
      #talk[hidden], #talk [hidden] { display: none !important; }
      #talk::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: #0b0b0b; border: solid #2a2a2a; border-width: 0 1px 1px 0; transform: rotate(45deg); }
      .tk-head { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-bottom: 1px solid #1f1f1f; }
      .tk-grow { flex: 1; min-width: 0; }
      .tk-av { flex: none; width: 32px; height: 32px; border-radius: 50%; background: #1c1c1c; display: grid; place-items: center; overflow: hidden; font-size: 16px; }
      .tk-av.sm { width: 26px; height: 26px; font-size: 13px; }
      .tk-av img { width: 100%; height: 100%; object-fit: cover; }
      .tk-x { background: none; border: 0; color: #9a9a9a; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 8px; }
      .tk-x:hover { background: #1c1c1c; color: #fff; }
      .tk-mute { color: #9a9a9a; font-size: 12px; }
      .tk-up { color: #7cf5c4; } .tk-down { color: #ff8d8d; }
      .tk-stream { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
      .tk-hello { margin: 0; }
      .tk-msg { max-width: 90%; display: grid; gap: 2px; }
      .tk-msg p { margin: 0; padding: 7px 10px; border-radius: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .tk-msg.user { align-self: flex-end; } .tk-msg.user p { background: #7cf5c4; color: #000; border-bottom-right-radius: 4px; }
      .tk-msg.fly p { background: #1a1a1a; border-bottom-left-radius: 4px; }
      .tk-trade p { background: #121a16 !important; font-size: 12px; }
      .tk-why { color: #9a9a9a; }
      .tk-time { color: #6f6f6f; font-size: 10px; padding: 0 4px; }
      .tk-card { padding: 9px; border: 1px solid #2a2a2a; border-radius: 12px; display: grid; gap: 6px; background: #101010; }
      .tk-card.money { border-color: #ff8d8d; }
      .tk-card ul { margin: 0; padding-left: 16px; color: #9a9a9a; font: 11px/1.4 ui-monospace, monospace; }
      .tk-row { display: flex; gap: 8px; align-items: center; }
      .tk-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .tk-btn { padding: 7px 14px; border: 0; border-radius: 999px; background: #7cf5c4; color: #06140e; font: 600 12px inherit; cursor: pointer; }
      .tk-btn.sm { padding: 5px 10px; font-size: 11px; }
      .tk-btn.plain { background: #1c1c1c; color: #fff; border: 1px solid #2a2a2a; }
      .tk-btn:disabled { opacity: .5; cursor: default; }
      .tk-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px 0; scrollbar-width: none; }
      .tk-chip { flex: none; padding: 5px 10px; border-radius: 999px; border: 1px solid #2a2a2a; background: none; color: #ddd; font: 500 11px inherit; cursor: pointer; }
      .tk-chip:hover { border-color: #7cf5c4; }
      .tk-chip.on { border-color: #7cf5c4; background: #7cf5c4; color: #06140e; }
      .tk-watch, .tk-form { display: flex; gap: 6px; padding: 8px 12px 0; }
      .tk-form { padding-bottom: 4px; }
      .tk-input { flex: 1; min-width: 0; padding: 7px 11px; background: #000; color: #fff; border: 1px solid #2a2a2a; border-radius: 999px; font: inherit; }
      .tk-input:focus { outline: none; border-color: #7cf5c4; }
      .tk-note { margin: 0; padding: 2px 14px 9px; color: #9a9a9a; font-size: 11px; min-height: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .tk-link { background: none; border: 0; padding: 0; color: #7cf5c4; font: inherit; cursor: pointer; text-decoration: underline; }
      .tk-typing p { display: flex; gap: 4px; padding: 10px 12px; }
      .tk-typing i { width: 6px; height: 6px; border-radius: 50%; background: #9a9a9a; animation: tk-dot 1s infinite ease-in-out; }
      .tk-typing i:nth-child(2) { animation-delay: .15s; } .tk-typing i:nth-child(3) { animation-delay: .3s; }
      @keyframes tk-dot { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
      /* the Expeditions card (src/expeditions.ts), in the chat panel in place of the stream */
      .tk-exp { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
      .xp-head { display: grid; gap: 4px; }
      .xp-bar { height: 6px; border-radius: 999px; background: #1c1c1c; overflow: hidden; }
      .xp-bar i { display: block; height: 100%; background: #7cf5c4; border-radius: 999px; transition: width .4s; }
      .xp-stats { font-size: 11px; }
      .xp-trip { gap: 8px; }
      .xp-places, .xp-bag { display: grid; gap: 6px; }
      .xp-place { display: flex; gap: 6px; align-items: center; padding: 7px 9px; border: 1px solid #2a2a2a; border-radius: 12px; background: #101010; }
      .xp-place.locked { opacity: .55; }
      .xp-tabs { padding: 0; }
      .xp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
      .xp-tile { position: relative; height: 48px; border-radius: 10px; border: 1px solid #2a2a2a; background: #101010; cursor: pointer; padding: 0; color: #fff; }
      .xp-tile.picked { background: #1c1c1c; }
      .xp-tile.worn::after { content: "✓"; position: absolute; top: 2px; left: 4px; font-size: 10px; color: #7cf5c4; }
      .xp-tile small { position: absolute; right: 4px; bottom: 2px; font-size: 10px; color: #9a9a9a; }
      .xp-glyph { font-size: 16px; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
      .xp-glyph.big { font-size: 24px; }
      .xp-finds { display: flex; flex-wrap: wrap; gap: 6px; }
      .xp-swarm { display: grid; gap: 4px; padding: 8px 9px; border: 1px solid #2a2a2a; border-radius: 12px; background: #101010; }
      .xp-tier { opacity: .35; } .xp-tier.on { opacity: 1; }
      .xp-toys { gap: 6px; }
      .xp-toys .tk-chip { font-size: 12px; }
      .xp-toys .tk-chip:disabled { opacity: .5; cursor: default; }
      .xp-tile .xp-art { display: block; margin: 0 auto; }
      .xp-find { display: inline-flex; gap: 5px; align-items: center; padding: 4px 8px; border: 1px solid; border-radius: 999px; font-size: 12px; }
      #bubble::after { content: ""; position: absolute; left: 18px; bottom: -6px; width: 10px; height: 10px; background: #1a1a1a; border: solid #2f2f2f; border-width: 0 1px 1px 0; transform: rotate(45deg); }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="talk" hidden></div>
      <div id="bubble"></div>
      <div id="look"><div id="wings"></div><img id="fly" alt="" draggable="false" /><div id="wear"></div></div>
      <div id="gift" hidden>🎁</div>
      <div id="away" hidden></div>
      <div id="focus" hidden></div>
    </div>
    <script type="module" src="/src/pet.ts"></script>
  </body>
</html>
