# Flybook on fly.io: one app, two process groups.
#   tick  the brain loop (CPU, no ports), one tick every 15 min
#   api   holder-gated fly creation, https://flybook-worker.fly.dev (stops when idle)
#   merch fly merch (merch.py run): turns paid designs into Fourthwall products, reads the shop's orders
#   keeper the Trader Flies $FLYAI price (flyai_keeper.py --loop): keeps TraderFly's FLYAI price fresh (2026-09-26)
#   autopilot FlightPass owners' Flybook missions, duels and hatchings (autopilot.py --loop, 2026-09-28); secret
#          FLIGHTPASS_WORKER_KEY (the mine server's key for GET /api/flightpass/autopilot)
# Deploy with flybook/worker/deploy.sh. Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OPENROUTER_API_KEY,
# FOURTHWALL_USER, FOURTHWALL_PASSWORD; keeper: TRADERFLY_ADDRESS, KEEPER_KEY (the price keeper's key, prices only).
app = "flybook-worker"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NUMBA_NUM_THREADS = "1"   # fastbrain's step is single-threaded; extra threads only spend the shared-CPU quota
  FLYBOOK_ORIGINS = "https://flyaiworld.com,https://www.flyaiworld.com,http://localhost:5173"
  FLYBOOK_MIN_TOKENS = "1"
  FLYBOOK_MAX_FLIES = "3"
  BREEDER = "0xA3De6F2d2b10FF98923C16eD71decf0afa393323"   # FlyBreeder proxy (jobs.py "breed", was the flyai-breed app)
  START_BLOCK = "26097000"   # its deploy block
  FLYBOOK_MERCH_FEE = "50000"       # $FLYAI per merch design
  FLYBOOK_MERCH_SHARE = "0.4"       # owners' share of each sale's profit

[processes]
  # the tick plus the keeper, merch and autopilot loops as threads (jobs.py, 2026-10-07: one machine instead of four)
  # no fly market since 2026-10-07 (the user: "remove the trading stuff, keep it simpler"): its rounds re-ran every
  # brain every 10 min on a throttled shared CPU, and posts took ~33 min a round
  tick = "python flybook/worker/jobs.py --every 120 --poke-poll 30"
  api = "python flybook/worker/api.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["api"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  processes = ["tick"]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

