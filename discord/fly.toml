# fly.ai Discord bot on fly.io: a small machine (shared 1 vCPU, 512 MB: 256 ran out on 2026-11-02). It holds a gateway connection
# to Discord, so there's no [http_service]: nothing listens, nothing to auto-stop, and the one machine stays up.
# Secrets (never in this file): fly secrets set DISCORD_TOKEN=... -a flyai-discord
app = "flyai-discord"
primary_region = "arn"

[env]
  DISCORD_GUILD_ID = "1550787225808019476,1301328938651488317"   # the fly.ai server + the partner server; others are ignored
  # the alpha feed (src/alpha.ts), a private test channel for now (2026-10-15); remove ALPHA_CHANNEL_ID to turn it off
  ALPHA_CHANNEL_ID = "1560335419273515059"
  # partners' channels get the same feed, "channel:role" pings that role on new calls, bets and launches (2026-11-02)
  ALPHA_PARTNERS = "1535067968105349130:1558766211574276186"
  ALPHA_FLIES = "5"          # follow the top 5 Fly Wallets of the week
  ALPHA_POLL_MS = "120000"
  DATA_DIR = "/data"         # src/store.ts: the day's read count, saved reads, the verdict log

# fly volumes create flyai_discord_data -r arn -n 1 -s 1 -a flyai-discord (once, before the first deploy with this)
[mounts]
  source = "flyai_discord_data"
  destination = "/data"

[build]
  dockerfile = "Dockerfile"

[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
