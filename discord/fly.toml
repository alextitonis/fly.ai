# fly.ai Discord bot + the Virtuals ACP provider agent (flytrade/acp) on one small machine (start.mjs runs both; merged
# 2026-11-18 to save the flyai-acp machine). Shared 1 vCPU, 512 MB (256 ran out on 2026-11-02; the two together use
# ~340 MB) plus 512 MB swap for the agent's `acp` CLI calls. Both only call out (Discord gateway, Virtuals, flyai-x402),
# so there's no [http_service]: nothing listens, nothing to auto-stop, and the one machine stays up.
# Deploy with deploy.sh (it stages flytrade/acp in as ./acp). Secrets (never in this file):
#   DISCORD_TOKEN (and the bot's research keys), INTERNAL_KEY (the same value on flyai-x402: the agent's jobs)
app = "flyai-discord"
primary_region = "arn"
swap_size_mb = 512         # top-level: room for the agent's short `acp` CLI runs

[env]
  DISCORD_GUILD_ID = "1550787225808019476,1301328938651488317"   # the fly.ai server + the partner server; others are ignored
  # the alpha feed (src/alpha.ts), a private test channel for now (2026-10-15); remove ALPHA_CHANNEL_ID to turn it off
  ALPHA_CHANNEL_ID = "1560335419273515059"
  # partners' channels get the same feed, "channel:role" pings that role on new calls, bets and launches (2026-11-02)
  ALPHA_PARTNERS = "1535067968105349130:1558766211574276186"
  ALPHA_FLIES = "5"          # follow the top 5 Fly Wallets of the week
  ALPHA_POLL_MS = "120000"
  DATA_DIR = "/data"         # src/store.ts: the day's read count, saved reads, the verdict log
  # the Virtuals agent (acp/provider.mjs): its state + sign-in in /data/acp-agent; ACP = "0" turns it off
  X402_URL = "https://flyai-x402.fly.dev"
  POLL_MS = "5000"

# fly volumes create flyai_discord_data -r arn -n 1 -s 1 -a flyai-discord (once, before the first deploy with this)
[mounts]
  source = "flyai_discord_data"
  destination = "/data"

[build]
  dockerfile = "Dockerfile"

[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
